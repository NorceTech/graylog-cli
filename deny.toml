[advisories]
yanked = "deny"
# RUSTSEC-2026-0173: proc-macro-error2 is unmaintained. It arrives
# transitively via tabled_derive (already at latest) and runs only at
# compile time inside derive macros, so the exposure is accepted.
ignore = ["RUSTSEC-2026-0173"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[licenses.private]
# graylog-cli itself is marked `publish = false` in Cargo.toml — this tool
# ships as a binary via GitHub Releases, not to crates.io, so it has no
# project license and cargo-deny should skip license checks for it.
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
