name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  flake-check:
    name: flake check (fmt + hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix flake lock --update-input fenix
      - run: nix flake check --print-build-logs

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix flake lock --update-input fenix
      - run: nix develop .#ci --command cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix flake lock --update-input fenix
      - run: nix develop .#ci --command cargo test --all --locked

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix flake lock --update-input fenix
      - run: nix develop .#ci --command cargo deny --all-features check

  build-linux:
    name: build (linux-x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix flake lock --update-input fenix
      - run: nix build --print-build-logs

  build-macos:
    name: build (macos-aarch64)
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix flake lock --update-input fenix
      - run: nix build --print-build-logs

  build-windows:
    name: build (windows-x86_64)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix flake lock --update-input fenix
      # crates.io rate-limits Nix's parallel crate fetches (HTTP 403) on
      # shared CI egress IPs; retrying converges via cached store paths.
      - run: |
          for attempt in 1 2 3 4; do
            if nix build .#graylog-cli-windows --print-build-logs; then
              break
            fi
            echo "windows build attempt $attempt failed; retrying in 120s..."
            sleep 120
            if [ "$attempt" = 4 ]; then exit 1; fi
          done
